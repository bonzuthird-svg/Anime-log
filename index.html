<style>
:root{
  --bg:#0e1014;--surface:#171a21;--line:#262b36;--muted:#8b93a5;--text:#eef0f4;--border:#3a4152;
  --accent:#f2a65a;--on-accent:#1a1205;--teal-bg:#12302c;--teal:#5fd8c0;--danger:#ff6b6b;
  color-scheme:dark;
}
:root[data-xdark]{--bg:#000;--surface:#0c0e12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.35;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 8px;display:flex;align-items:center;gap:8px}
.top h1{font-size:28px;line-height:34px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.ib[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ib svg{width:22px;height:22px}
.search{display:flex;gap:8px;padding-bottom:8px}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:88px;padding:10px 14px;resize:vertical}
select.inp{appearance:none}
main{padding-bottom:calc(var(--barpad,96px) + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding-top:6px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;padding:10px;font-weight:700;font-size:14px;line-height:17px;color:#fff;background:#4a4f5e}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{position:relative}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;letter-spacing:.5px;z-index:1}
.cap{font-size:15px;font-weight:700;line-height:19px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.full{width:100%}
.list{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.row .th{width:48px;height:70px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;background:#4a4f5e}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.stars{display:inline-flex;gap:1px}
.stars svg{width:14px;height:14px}
#app,.sheet,#wheel,#dial{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
html[data-still] *{transition:none!important;animation:none!important}
body.gridbg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px}
#wheel,#dial{position:fixed;inset:0;z-index:50;touch-action:none}
#wheel{background:rgba(5,6,9,.74)}
#wheel path{fill:var(--surface);stroke:var(--border);stroke-width:1}
#wheel path.on{fill:var(--accent);stroke:var(--accent)}
#wheel .wd{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:var(--muted);pointer-events:none;width:64px;text-align:center;line-height:13px}
#wheel .wd svg{width:22px;height:22px}
#wheel .wd.on{color:var(--on-accent)}
#wheel .wc{position:absolute;width:84px;height:84px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;line-height:16px;background:var(--bg);border:1px solid var(--border);color:var(--accent);pointer-events:none;padding:8px}
#dial{background:rgba(5,6,9,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.dtitle{font-weight:700;font-size:16px;text-align:center;max-width:300px}
.dr{position:relative;width:300px;height:300px;border-radius:50%;border:1px dashed var(--line)}
.ds{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:1.5px solid var(--border);color:var(--muted);background:var(--surface);pointer-events:none;transition:transform .12s,background .12s}
.ds.past{background:#1d212b;color:#566073;opacity:.8;transform:translate(-50%,-50%) scale(.8)}
.ds.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent);transform:translate(-50%,-50%) scale(1.18)}
.dc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;text-align:center;pointer-events:none}
.dn{font-size:44px;line-height:48px;font-weight:700;color:var(--accent)}
.hud{position:relative;padding:14px;background:rgba(23,26,33,.9);border:1px solid var(--line)}
.hud::before,.hud::after{content:'';position:absolute;width:12px;height:12px;border:0 solid var(--accent)}
.hud::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.hud::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.hl{font-size:11px;line-height:16px;letter-spacing:2px;font-weight:700;color:var(--muted);text-transform:uppercase}
.hv{font-size:30px;line-height:38px;font-weight:700}
.ringfg{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.bfill{height:8px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.grip{width:28px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;flex-shrink:0;cursor:grab;margin-left:-4px}
.grip svg{width:16px;height:22px}
.dayb{height:68px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(80% 36% at 50% -4%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
#app{position:relative;z-index:1}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-size:14px;font-weight:700;vertical-align:middle;margin-left:6px}
.cover{border-radius:16px;box-shadow:0 10px 22px rgba(0,0,0,.38)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 58%);pointer-events:none}
.cover span{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.cover .badge{z-index:2;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 70%,transparent)}
.mono{position:absolute;right:-2px;top:-8px;font-style:normal;font-size:84px;line-height:1;font-weight:700;color:rgba(255,255,255,.15)}
.airs{position:absolute;top:8px;right:8px;z-index:2;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff}
.art,.row .th.art{background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.24),transparent 40%),linear-gradient(155deg,color-mix(in srgb,var(--c) 68%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 48%,#000) 100%)}
.row .th{box-shadow:0 4px 10px rgba(0,0,0,.35)}
.row,.card .cover{transition:transform .12s}
.btn,.ib,.tab,.dayb,.card>button{transition:transform .1s}
.btn:active,.ib:active,.tab:active,.dayb:active,.card>button:active{transform:scale(.96)}
.bar{height:7px}
.bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent));box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.tl{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);padding:3px 9px 3px 6px;border-radius:10px;width:fit-content}
.banner{display:flex;align-items:center;gap:14px;padding:14px;margin:6px 0 4px;border-radius:18px;border:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 17%,var(--surface)),var(--surface) 72%);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.big{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.5px}
.tab{position:relative}
.tab[aria-selected="true"]::before{content:'';position:absolute;top:-6px;width:30px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.tab[aria-selected="true"] svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 70%,transparent))}
.tabs{box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.glow{position:absolute!important;left:0;right:0;top:0;height:340px;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 62%,transparent),transparent 72%)}
.sheet>*{position:relative}
.hero .cover{box-shadow:0 14px 34px color-mix(in srgb,var(--c) 55%,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px;animation:burst 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--x),calc(var(--y) + 230px)) rotate(var(--r));opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes slideup{from{opacity:0;transform:translateY(26px)}}
@keyframes pop{from{opacity:0;transform:scale(.82)}}
#app.enter main>.grid>*,#app.enter main>.list>*,#app.enter .hud,#app.enter .banner,#app.enter main>.seg,#app.enter main>.sec{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#app.enter .sheet{animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
#app.enter .grid>:nth-child(2),#app.enter .list>:nth-child(2){animation-delay:.04s}
#app.enter .grid>:nth-child(3),#app.enter .list>:nth-child(3){animation-delay:.08s}
#app.enter .grid>:nth-child(4),#app.enter .list>:nth-child(4){animation-delay:.12s}
#app.enter .grid>:nth-child(5),#app.enter .list>:nth-child(5){animation-delay:.16s}
#app.enter .grid>:nth-child(6),#app.enter .list>:nth-child(6){animation-delay:.2s}
#app.enter .grid>:nth-child(n+7),#app.enter .list>:nth-child(n+7){animation-delay:.24s}
#wheel>div{animation:pop .16s ease-out}
#dial .dr{animation:pop .2s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chip{display:inline-flex;align-self:flex-start;align-items:center;padding:4px 10px;border-radius:12px;border:1px dashed var(--border);font-size:12px;color:var(--muted)}
.ib:disabled{opacity:.35}
.tab span{font-size:11px;white-space:nowrap}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overflow-x:hidden;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet-h h2{font-size:24px;line-height:30px;font-weight:700;flex:1;min-width:0}
.sec{margin-top:18px}
.lbl{font-size:12px;letter-spacing:1px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;height:42px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.flex{display:flex;gap:10px;align-items:center}
.flex>*{min-width:0}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw button{height:46px;border-radius:23px;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.sw button[aria-pressed="true"]{border:3px solid var(--text)}
.sw svg{width:20px;height:20px}
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .cover{width:112px;flex-shrink:0}
.starsbig{display:flex;gap:4px}
.starsbig button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.starsbig svg{width:30px;height:30px}
.sw-t{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.sw-t .t{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex-shrink:0}
.sw-t .t i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:12px;background:var(--muted);transition:transform .15s}
.sw-t[aria-checked="true"] .t{background:var(--accent)}
.sw-t[aria-checked="true"] .t i{transform:translateX(20px);background:var(--on-accent)}
.tip{display:flex;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;font-size:14px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;background:var(--teal-bg);color:var(--teal);font-size:12px;margin:0 6px 6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.sw-t .t i{transition:none}}
</style>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'show';
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
const TAGMAP={'Overgeared':['Isekai','Fantasy','Comedy'],'Mushoku Tensei: Jobless Reincarnation':['Isekai','Fantasy'],'That Time I Got Reincarnated as a Slime':['Isekai','Fantasy'],'Overlord':['Isekai','Dark fantasy'],'Re:Zero':['Isekai','Dark fantasy'],'The Rising of the Shield Hero':['Isekai','Fantasy'],'Tsukimichi: Moonlit Fantasy':['Isekai','Fantasy'],'The Eminence in Shadow':['Isekai','Comedy'],'Lord of Mysteries':['Mystery','Dark fantasy'],'Hunter x Hunter':['Adventure','Action'],'Mob Psycho 100':['Supernatural','Comedy'],'Erased':['Mystery','Thriller'],'Tokyo Ghoul':['Dark fantasy','Horror'],'Death Note':['Mystery','Thriller'],'Fullmetal Alchemist: Brotherhood':['Adventure','Fantasy'],'Attack on Titan':['Dark fantasy','Action'],'Vinland Saga':['Historical','Action'],'Dungeon Meshi':['Fantasy','Comedy'],'Spy x Family':['Comedy','Action'],'One Punch Man':['Action','Comedy'],'Saiki K':['Comedy'],'Dr. Stone':['Adventure','Sci-fi'],'Berserk':['Dark fantasy','Action'],'Made in Abyss':['Dark fantasy','Adventure'],"Hell's Paradise":['Dark fantasy','Action'],'Jujutsu Kaisen':['Dark fantasy','Supernatural'],'Solo Leveling':['Action','Fantasy'],'Kaiju No. 8':['Action','Sci-fi'],'Dandadan':['Supernatural','Comedy'],'Steins;Gate':['Sci-fi','Mystery'],'Parasyte':['Horror','Mystery'],'Kingdom':['Historical','Action'],'Goblin Slayer':['Dark fantasy','Action'],'Claymore':['Dark fantasy','Action']};
function mk(title,status,o){o=o||{};return Object.assign({id:slug(title)+'-'+(hash(title)%1000),title,aliases:[],status,ep:0,total:0,rating:0,tags:[],where:'',airs:'',newSeason:false,notes:'',cover:'',color:COVERS[hash(title)%COVERS.length],order:0,rewatches:0,days:[],updated:Date.now()},o)}
function fmtMin(m){const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'}
function timeLeft(s){if(!(s.total>0))return '';const n=s.total-(s.ep||0);if(n<=0)return '';return fmtMin(n*((s.mins>0?s.mins:0)||S.settings.epMins||24))}
function finishBy(n){const d=new Date();d.setDate(d.getDate()+Math.max(0,n-1));return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function bigRing(p,sz){sz=sz||92;const r=sz/2-8,C=2*Math.PI*r,c=sz/2;
  return `<div style="position:relative;width:${sz}px;height:${sz}px;flex-shrink:0"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(Math.min(100,p)/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})" style="filter:drop-shadow(0 0 6px var(--accent))"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${sz>80?20:15}px">${Math.round(p)}%</div></div>`}
function banner(){
  const mins=s=>(s.total-(s.ep||0))*((s.mins>0?s.mins:0)||S.settings.epMins||24);
  const all=Object.values(S.shows).filter(s=>s.status==='watching'&&s.total>0);
  const w=all.filter(s=>s.total>(s.ep||0));
  if(!w.length)return '';
  const tot=w.reduce((n,s)=>n+mins(s),0),nx=w.slice().sort((a,b)=>mins(a)-mins(b))[0];
  const done=all.reduce((n,s)=>n+Math.min(s.ep||0,s.total),0),sum=all.reduce((n,s)=>n+s.total,0);
  return `<div class="banner">${bigRing(done/sum*100,76)}<div style="min-width:0"><div class="hl">Time left</div><div class="big">${fmtMin(tot)}</div><div class="sub">${w.length} show${w.length>1?'s':''} · closest to done: ${esc(nx.title)} in ${fmtMin(mins(nx))}</div></div></div>`}
function confetti(){
  if(reduced())return;
  const w=document.createElement('div');w.className='confetti';document.body.appendChild(w);
  const cols=['var(--accent)','#ffffff','#5fd8c0','#ff7ac8','#f5c542'];
  for(let i=0;i<28;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=90+Math.random()*150;
    p.style.cssText='--x:'+(Math.cos(a)*d).toFixed(0)+'px;--y:'+(Math.sin(a)*d-70).toFixed(0)+'px;--r:'+Math.round(Math.random()*720-360)+'deg;background:'+cols[i%5]+';left:50%;top:42%;animation-delay:'+Math.round(Math.random()*80)+'ms';w.appendChild(p)}
  setTimeout(()=>w.remove(),1500)}
function fmtClock(t){const p=String(t).split(':').map(Number);if(p.length<2||isNaN(p[0]))return '';return ((p[0]%12)||12)+':'+String(p[1]).padStart(2,'0')+(p[0]<12?' AM':' PM')}
function seed(){const m={};SEED.forEach((r,i)=>{const s=mk(r[1],r[0],r[2]);s.order=i;m[s.id]=s});return m}

/* ---------- storage: localStorage cache + db (durable) ---------- */
const LS='anime-log-v1';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');return v&&v.shows?v:null}catch(e){return null}}
function saveShow(s,keep){if(!keep)s.updated=Date.now();lsSave();clearTimeout(timers[s.id]);
  timers[s.id]=setTimeout(()=>{if(db)db.collection('shows').doc(s.id).set(s).catch(()=>{ui.note='Saved on this device only';})},350)}
function delShow(id){delete S.shows[id];lsSave();if(db)db.collection('shows').doc(id).delete().catch(()=>{})}
function saveSettings(){lsSave();if(db)db.doc('meta/settings').set(S.settings).catch(()=>{})}
async function init(){
  const cached=lsLoad();
  if(cached){S.shows=cached.shows;Object.assign(S.settings,cached.settings)}
  applyTheme();render();
  try{db=await claude.use('db')}catch(e){db=null}
  try{dl=await claude.use('downloads')}catch(e){dl=null}
  if(db){
    try{
      const snap=await db.collection('shows').get();
      if(!snap.empty){const m={};snap.docs.forEach(d=>{m[d.id]=JSON.parse(JSON.stringify(d.data()))});S.shows=m}
      else if(!Object.keys(S.shows).length){S.shows=seed();await Promise.all(Object.values(S.shows).map(s=>db.collection('shows').doc(s.id).set(s)))}
      else{await Promise.all(Object.values(S.shows).map(s=>db.collection('shows').doc(s.id).set(s)))}
      const st=await db.doc('meta/settings').get();
      if(st.exists)Object.assign(S.settings,JSON.parse(JSON.stringify(st.data())));else await db.doc('meta/settings').set(S.settings);
    }catch(e){ui.note='Working offline on this device'}
  }
  if(!Object.keys(S.shows).length)S.shows=seed();
  if(!S.settings.tagsV){Object.values(S.shows).forEach(s=>{const t=TAGMAP[s.title];if(t&&!(s.tags||[]).length){s.tags=t.slice();if(db)db.collection('shows').doc(s.id).set(s).catch(()=>{})}});S.settings.tagsV=1;saveSettings()}
  lsSave();applyTheme();render();
  try{if(!localStorage.getItem('al-hint')){localStorage.setItem('al-hint','1');toast('Tip: hold anywhere, slide to a tab, let go.')}}catch(e){}
}

/* ---------- logic ---------- */
function applyTheme(){const r=document.documentElement;r.style.setProperty('--accent',S.settings.accent);
  if(S.settings.reduce)r.setAttribute('data-still','');else r.removeAttribute('data-still');
  if(S.settings.xdark)r.setAttribute('data-xdark','');else r.removeAttribute('data-xdark')}
function names(s){return [s.title].concat(s.aliases||[]).join(' ').toLowerCase()}
function shows(status){
  const q=ui.q.trim().toLowerCase();
  let a=Object.values(S.shows).filter(s=>s.status===status&&(!q||names(s).includes(q)));
  if(status==='watching')a.sort((x,y)=>y.updated-x.updated);
  else if(status==='watched')a.sort((x,y)=>(y.rating||0)-(x.rating||0)||x.title.localeCompare(y.title));
  else a.sort((x,y)=>x.order-y.order);
  return a}
function bump(k,n){S.settings[k]=(S.settings[k]||0)+n;saveSettings()}
function onFinish(s){bump('xp',25);bump('fin',1);if((s.tags||[]).some(t=>String(t).toLowerCase()==='isekai'))bump('isek',1)}
function addEps(s,n){
  n=Math.max(0,Math.floor(n)||0);if(!n)return;
  if(s.status==='unwatched'||s.status==='watched'){s.status='watching'}
  s.ep=(s.ep||0)+n;bump('xp',n);bump('eps',n);
  const t=today();if(!(s.days||[]).includes(t)){s.days=(s.days||[]).concat(t).slice(-400)}
  if(s.total>0&&s.ep>=s.total){s.ep=s.total;s.status='watched';onFinish(s);confetti();ui.toast='Finished '+s.title+'! Rate it'}
  saveShow(s)}
function toast(m){ui.toast=m;render();clearTimeout(timers._t);timers._t=setTimeout(()=>{ui.toast='';render()},2200)}

function coverBox(s){
  const ini=esc((String(s.title).match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase());
  return `<div class="cover art" style="--c:${s.color}">${s.cover?`<img src="${esc(s.cover)}" alt="">`:`<i class="mono">${ini}</i><span>${esc(s.title)}</span>`}${s.newSeason?'<div class="badge">NEW SEASON</div>':''}${s.airs&&s.status==='watching'?`<div class="airs">${esc(s.airs.slice(0,3).toUpperCase())}</div>`:''}</div>`}
function progress(s){
  if(s.status==='watching'){const pct=s.total?Math.min(100,Math.round(s.ep/s.total*100)):0;
    return `<div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${s.total?`Ep ${s.ep} / ${s.total} · ${s.total-s.ep} left`:`Ep ${s.ep}`}${s.airs?` · ${esc(s.airs)}`:''}</div>${timeLeft(s)?`<div class="tl"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(pct*50.27/100).toFixed(1)} 50.27" transform="rotate(-90 10 10)"/></svg>About ${timeLeft(s)} left</div>`:''}`}
  if(s.status==='watched')return stars(s.rating)||'<div class="sub">Finished</div>';
  return `<div class="sub">${s.where?esc(s.where):'Up next'}</div>`}
function card(s){
  const plus=s.status==='watching'?`<div class="flex"><button class="btn pri" style="flex:1" data-act="plus" data-id="${s.id}" aria-label="Add one episode to ${esc(s.title)}">+1 ep</button><button class="btn" data-act="dial" data-id="${s.id}" aria-label="Add several episodes to ${esc(s.title)}">+N</button></div>`:'';
  return `<div class="card"><button data-act="open" data-id="${s.id}" style="text-align:left;display:flex;flex-direction:column;gap:8px">${coverBox(s)}<div class="cap">${esc(s.title)}</div></button>${progress(s)}${plus}</div>`}
function rowv(s){
  const plus=s.status==='watching'?`<div class="flex" style="flex-shrink:0"><button class="btn pri" style="padding:0 12px" data-act="plus" data-id="${s.id}" aria-label="Add one episode">+1</button><button class="btn" style="padding:0 12px" data-act="dial" data-id="${s.id}" aria-label="Add several episodes">+N</button></div>`:'';
  return `<div class="row"><button data-act="open" data-id="${s.id}" class="flex" style="flex:1;text-align:left;min-width:0"><div class="th art" style="--c:${s.color}">${s.cover?`<img src="${esc(s.cover)}" alt="">`:''}</div><div class="mid"><div class="cap">${esc(s.title)}${s.newSeason?' <span class="tag" style="margin:0 0 0 4px">NEW SEASON</span>':''}</div>${progress(s)}</div></button>${plus}</div>`}

function tabBar(){
  if(S.settings.bar===false)return '';
  const t=[['watching','Watching',I.play],['watched','Watched',I.check],['unwatched','Unwatched',I.clock],['calendar','Calendar',I.cal],['picks','Top Picks',I.spark]];
  return `<nav class="tabs" role="tablist">${t.map(x=>`<button class="tab" role="tab" aria-selected="${S.settings.tab===x[0]}" data-act="tab" data-v="${x[0]}">${x[2]}<span>${x[1]}</span></button>`).join('')}</nav>`}

function hdr(title,sub,extra){
  return `<header class="top"><div style="flex:1;min-width:0"><h1 style="display:block">${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>${extra||''}
    <button class="ib" data-act="add" aria-label="Add a show">${I.plus}</button>
    <button class="ib" data-act="settings" aria-label="Settings">${I.gear}</button></header>`}
function plusBtn(s){return s.status==='watching'?`<button class="btn pri" data-act="plus" data-id="${s.id}" aria-label="Add one episode to ${esc(s.title)}">+1</button>`:''}
function thumb(s){return `<div class="th art" style="--c:${s.color}">${s.cover?`<img src="${esc(s.cover)}" alt="">`:''}</div>`}

function main(){
  const tab=S.settings.tab;
  const body=tab==='calendar'?calendarView():tab==='picks'?picksView():tab==='stats'?statsView():tab==='top5'?top5View():tab==='unwatched'?queueView():mainBase();
  return body+tabBar()}

function queueView(){
  const full=Object.values(S.shows).filter(s=>s.status==='unwatched').sort((a,b)=>a.order-b.order);
  const q=ui.q.trim().toLowerCase();
  const vis=full.filter(s=>!q||names(s).includes(q));
  const rows=vis.map(s=>{const i=full.indexOf(s);
    return `<div class="row" style="border-color:${i===0?'var(--accent)':'var(--line)'}">${q?'':`<button class="grip" data-id="${s.id}" aria-label="Drag ${esc(s.title)} to reorder">${I.grip}</button>`}
    <div style="width:26px;text-align:center;font-size:22px;font-weight:700;color:${i===0?'var(--accent)':'var(--muted)'}">${i+1}</div>
    <button data-act="open" data-id="${s.id}" class="flex" style="flex:1;min-width:0;text-align:left">${thumb(s)}<div class="mid"><div class="cap">${esc(s.title)}</div><span class="chip">${s.where?esc(s.where):'Where to watch'}</span></div></button>
    <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
      <button class="ib" data-act="mv" data-id="${s.id}" data-v="-1" aria-label="Move ${esc(s.title)} up" ${i===0?'disabled':''}>${I.up}</button>
      <button class="ib" data-act="mv" data-id="${s.id}" data-v="1" aria-label="Move ${esc(s.title)} down" ${i===full.length-1?'disabled':''}>${I.down}</button></div></div>`}).join('');
  return hdr('Unwatched','Your Up Next queue',`<button class="ib" data-act="togsearch" aria-label="Search" aria-pressed="${ui.search}">${I.search}</button>`)+
    (ui.search?`<div class="search"><input class="inp" id="q" type="search" placeholder="Search names, English or Japanese" value="${esc(ui.q)}" aria-label="Search"></div>`:'')+
    `<main><button class="btn pri full" style="height:52px;font-size:16px" data-act="surprise">${I.dice.replace('<svg','<svg width="22" height="22"')} Surprise me</button>
    <div class="lbl" style="margin-top:18px">Up Next · use the arrows to reorder</div>
    <div class="list" style="padding-top:0">${rows||`<div class="empty">${q?'Nothing matches that.':'Your queue is empty. Add a show or grab one from Top Picks.'}</div>`}</div></main>`}

function calendarView(){
  const now=new Date(),todayI=(now.getDay()+6)%7;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-todayI);
  if(ui.calDay==null)ui.calDay=todayI;
  const sel=ui.calDay,dn=DAYS.slice(1),sn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const all=Object.values(S.shows);
  const dayShows=i=>all.filter(s=>s.airs===dn[i]&&s.status!=='watched');
  const dd=i=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
  const strip=sn.map((n,i)=>{const d=dd(i),on=i===sel,has=dayShows(i).length>0;

function cur(){return S.shows[ui.id]}
function readFields(){

function doCover(file){
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const w=260,h=Math.round(w*img.height/img.width);const c=document.createElement('canvas');c.width=w;c.height=Math.min(h,420);
    const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const s=cur();s.cover=c.toDataURL('image/jpeg',0.72);URL.revokeObjectURL(u);saveShow(s);render()};
  img.onerror=()=>toast('Could not read that image');img.src=u}
function doRestore(txt){
  try{const o=JSON.parse(txt);if(!o||!o.shows)throw 0;
    const arr=Array.isArray(o.shows)?o.shows:Object.values(o.shows);
    arr.forEach(s=>{if(s&&s.id&&s.title){S.shows[s.id]=Object.assign(mk(s.title,s.status||'unwatched'),s);saveShow(S.shows[s.id])}});
    if(o.settings){Object.assign(S.settings,o.settings);saveSettings()}
    applyTheme();toast('Restored '+arr.length+' shows')}catch(e){toast('That backup could not be read')}}
const ALQ='query($s:String,$st:MediaStatus){Page(perPage:6){media(search:$s,type:ANIME,sort:SEARCH_MATCH,status:$st){id title{romaji english native} synonyms episodes status format genres coverImage{large} nextAiringEpisode{episode airingAt}}}}';
let alChain=Promise.resolve(),alLast=0;
function alFetch(search,releasing){
  const job=async()=>{
    const gap=window.__alGap!=null?window.__alGap:2100,wait=alLast+gap-Date.now();
    if(wait>0)await new Promise(r=>setTimeout(r,wait));
    for(let k=0;k<2;k++){
      const vars={s:search};if(releasing)vars.st='RELEASING';
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:ALQ,variables:vars})});
      alLast=Date.now();
      if(r.status===429){const ra=parseInt(r.headers.get('Retry-After'),10)||60;await new Promise(x=>setTimeout(x,Math.min(ra,90)*1000));continue}
      if(!r.ok)throw new Error('http '+r.status);
      const j=await r.json();if(j.errors&&!j.data)throw new Error('graphql');
      return (j.data&&j.data.Page&&j.data.Page.media)||[]}
    throw new Error('rate')};
  const p=alChain.then(job,job);alChain=p.catch(()=>{});return p}
const nrm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function bestMatch(s,list){
  const want=[s.title].concat(s.aliases||[]).map(nrm).filter(Boolean);let best=null,bs=0;
  list.forEach((m,i)=>{
    const ns=[m.title.english,m.title.romaji,m.title.native].concat(m.synonyms||[]).map(nrm).filter(Boolean);let sc=0;
    want.forEach(w=>ns.forEach(n=>{if(n===w)sc=Math.max(sc,3);else if(w.length>3&&n.length>3&&(n.includes(w)||w.includes(n)))sc=Math.max(sc,2)}));
    if(sc)sc+=(list.length-i)*0.01;
    if(sc>bs){bs=sc;best=m}});
  return bs>=2?best:null}
function applyMedia(s,m,o){
  o=o||{};
  if(!s.cover&&m.coverImage&&m.coverImage.large)s.cover=m.coverImage.large;
  const have=new Set([s.title].concat(s.aliases||[]).map(nrm));const al=(s.aliases||[]).slice();
  [m.title.english,m.title.romaji,m.title.native].concat(m.synonyms||[]).forEach(n=>{if(n&&!have.has(nrm(n))&&al.length<8){have.add(nrm(n));al.push(n)}});
  s.aliases=al;
  if(!(s.tags||[]).length&&m.genres&&m.genres.length)s.tags=m.genres.slice(0,3);
  if(o.setTotal&&!s.total&&m.episodes)s.total=m.episodes;
  if(m.status==='RELEASING'&&m.nextAiringEpisode&&s.status!=='watched'){
    const d=new Date(m.nextAiringEpisode.airingAt*1000);
    if(!s.airs)s.airs=DAYS[(d.getDay()+6)%7+1];
    if(!s.airTime)s.airTime=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  s.al=m.id;return s}
function fm(msg){ui.fetchMsg=msg;const el=document.getElementById('fm');if(el)el.textContent=msg}
async function autofill(){

document.addEventListener('click',e=>{if(Date.now()<(ui.suppress||0)){e.stopPropagation();e.preventDefault()}},true);

/* ---------- number dial ---------- */
const dial={on:false,id:null,v:1,o:0,prev:0,drag:false,max:200,nodes:null};
function dialOpen(id){
  const s=S.shows[id];if(!s||dial.on)return;
  dial.on=true;dial.id=id;dial.v=1;dial.o=0;dial.drag=false;dial.max=s.total>0?Math.max(1,s.total-(s.ep||0)):200;
  const el=document.createElement('div');el.id='dial';
  el.innerHTML=`<div class="dtitle">${esc(s.title)}</div><div class="dr" id="dr">${Array.from({length:12},(_,j)=>{const p=polar(150,150,112,j*30);return `<div class="ds" style="left:${p[0].toFixed(1)}px;top:${p[1].toFixed(1)}px"></div>`}).join('')}<div class="dc"><div class="dn">+1</div><div class="sub dep"></div></div></div>
  <div class="sub" style="max-width:290px;text-align:center">Slide your finger around the ring. Keep circling for bigger numbers, and go back the other way to lower it.</div>
  <div class="flex" style="width:min(300px,86vw)"><button class="btn" style="flex:1" data-act="dialx">Cancel</button><button class="btn pri" style="flex:2" data-act="dialgo">Mark episodes</button></div>`;
  document.body.appendChild(el);
  dial.nodes={ds:el.querySelectorAll('.ds'),n:el.querySelector('.dn'),e:el.querySelector('.dep'),el};
  const dr=el.querySelector('#dr');
  dr.addEventListener('touchstart',dialDown,{passive:true});dr.addEventListener('mousedown',e=>{if(Date.now()-W.touchAt>800)dialDown(e)});
  dialPaint()}
function dialPaint(){
  const v=dial.v,s=(v-1+dial.o)%12;
  dial.nodes.ds.forEach((n,j)=>{const b=(s-j+12)%12;let val,cls;
    if(j===s){val=v;cls='sel'}else if(v-b>=1){val=v-b;cls='past'}else{val=v+((j-s+12)%12);cls='fut'}
    n.textContent=val;n.className='ds '+cls});
  const sh=S.shows[dial.id];dial.nodes.n.textContent='+'+v;dial.nodes.e.textContent='Ep '+(sh.ep||0)+' → '+((sh.ep||0)+v)}
function dialAt(p){const r=document.getElementById('dr').getBoundingClientRect();
  const dx=p.x-(r.left+r.width/2),dy=p.y-(r.top+r.height/2);
  return{d:Math.hypot(dx,dy),slot:Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/30)%12}}
function dialDown(e){const q=dialAt(pt(e));if(q.d<56)return;
  dial.drag=true;dial.prev=q.slot;dial.o=((q.slot-(dial.v-1))%12+12)%12;dialPaint()}
function dialMove(e){
  if(!dial.on||!dial.drag)return;if(e.cancelable)e.preventDefault();
  const q=dialAt(pt(e));if(q.d<40)return;
  let d=q.slot-dial.prev;if(d>6)d-=12;if(d<-6)d+=12;
  let v=dial.v+d;const want=v;v=Math.max(1,Math.min(dial.max,v));
  if(v!==want)dial.o=((q.slot-(v-1))%12+12)%12;
  if(v!==dial.v)vib(6);
  dial.v=v;dial.prev=q.slot;dialPaint()}
document.addEventListener('touchmove',dialMove,{passive:false});
document.addEventListener('mousemove',e=>{if(Date.now()-W.touchAt>800)dialMove(e)});
const dialUp=()=>{dial.drag=false};
document.addEventListener('touchend',dialUp);document.addEventListener('mouseup',dialUp);
function dialClose(go){
  if(!dial.on)return;const id=dial.id,v=dial.v;
  dial.nodes.el.remove();dial.nodes=null;dial.on=false;dial.drag=false;
  if(go&&S.shows[id]){addEps(S.shows[id],v);if(ui.toast){const m=ui.toast;ui.toast='';toast(m)}else render()}}
/* ---------- drag to reorder (Up Next) ---------- */
I.grip='<svg viewBox="0 0 18 22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="4" r="1.6"/><circle cx="13" cy="4" r="1.6"/><circle cx="5" cy="11" r="1.6"/><circle cx="13" cy="11" r="1.6"/><circle cx="5" cy="18" r="1.6"/><circle cx="13" cy="18" r="1.6"/></svg>';
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.grip');if(!g||drag)return;
  const row=g.closest('.row'),rows=[...row.parentElement.children];
  drag={row,rows,i:rows.indexOf(row),to:rows.indexOf(row),h:row.getBoundingClientRect().height+10,y0:e.clientY,pid:e.pointerId};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  row.style.position='relative';row.style.zIndex='3';row.style.boxShadow='0 8px 24px rgba(0,0,0,.5)';vib(10);e.preventDefault()});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dy=e.clientY-drag.y0;drag.row.style.transform='translateY('+dy+'px)';
  const to=Math.max(0,Math.min(drag.rows.length-1,drag.i+Math.round(dy/drag.h)));drag.to=to;
  drag.rows.forEach((r,k)=>{if(r===drag.row)return;let sh=0;
    if(drag.i<to&&k>drag.i&&k<=to)sh=-drag.h;else if(drag.i>to&&k<drag.i&&k>=to)sh=drag.h;
    r.style.transition='transform .12s';r.style.transform=sh?'translateY('+sh+'px)':''})});
function dragEnd(){
  if(!drag)return;const d=drag;drag=null;
  if(d.to!==d.i){const full=Object.values(S.shows).filter(s=>s.status==='unwatched').sort((x,y)=>x.order-y.order);
    const m=full.splice(d.i,1)[0];full.splice(d.to,0,m);full.forEach((s,n)=>{s.order=n;saveShow(s)})}
  render()}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.inst=e;if(ui.sheet==='settings')render()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
init();
})();
</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
